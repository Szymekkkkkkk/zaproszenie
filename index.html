
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zaproszenie na kawę ☕</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #d7b899, #f3dfc1, #c69c75);
}

/* Pływające elementy kawowe */
.coffee-float {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    animation: coffeeFloat linear forwards;
    z-index: 0;
    opacity: 0.8;
}

@keyframes coffeeFloat {
    0% {
        transform: translateY(0) rotate(-15deg);
        opacity: 0;
    }
    20% {
        opacity: 0.8;
    }
    100% {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
    }
}

/* Główna kartka */
.card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 390px;
    padding: 40px 25px;
    text-align: center;
    background: rgba(255,255,255,0.94);
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(75, 45, 20, 0.2);
    animation: appear 0.8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.icon {
    font-size: 75px;
    margin-bottom: 10px;
    animation: coffeePulse 2s infinite;
}

@keyframes coffeePulse {
    0%, 100% {
        transform: scale(1) rotate(-3deg);
    }
    50% {
        transform: scale(1.08) rotate(3deg);
    }
}

h1 {
    color: #79513a;
    font-size: clamp(25px, 7vw, 32px);
    line-height: 1.3;
    margin: 10px 0 15px;
}

p {
    color: #806b5a;
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    min-height: 55px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.2s, background 0.2s;
}

#yes-button {
    background: linear-gradient(135deg, #8b5e3c, #b17a50);
    color: white;
    box-shadow: 0 5px 15px rgba(120, 75, 40, 0.25);
}

#yes-button:hover {
    transform: scale(1.08);
    background: #70472e;
}

#no-button {
    background: #eee6df;
    color: #725b49;
    position: relative;
}

.footer {
    margin-top: 28px;
    font-size: 12px;
    color: #b39a83;
}

.success {
    animation: appear 0.8s ease;
}

.success h1 {
    font-size: 30px;
}

.success p {
    margin-bottom: 10px;
}

.success .coffee {
    font-size: 85px;
    margin: 20px 0;
    animation: coffeePulse 2s infinite;
}

@media (max-width: 380px) {
    .card {
        padding: 32px 18px;
    }

    button {
        padding: 13px 20px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="card" id="card">

    <div class="icon">☕</div>

    <h1>Czy wyjdziesz ze mną na kawę?</h1>

    <p>
        Mam ochotę spędzić z Tobą trochę czasu,
        porozmawiać przy dobrej kawie
        i po prostu miło spędzić dzień. 🤎
    </p>

    <div class="buttons">
        <button id="yes-button">Tak! ☕</button>
        <button id="no-button">Nie 😜</button>
    </div>

    <div class="footer">
        Najlepsza kawa smakuje w dobrym towarzystwie 🤎
    </div>

</div>

<script>
const noButton = document.getElementById("no-button");
const yesButton = document.getElementById("yes-button");
const card = document.getElementById("card");

let activated = false;

function moveNoButton() {
    if (!activated) {
        const rect = noButton.getBoundingClientRect();

        noButton.style.position = "fixed";
        noButton.style.left = rect.left + "px";
        noButton.style.top = rect.top + "px";
        noButton.style.zIndex = "10";

        activated = true;
    }

    const margin = 15;

    const maxX = window.innerWidth - noButton.offsetWidth - margin;
    const maxY = window.innerHeight - noButton.offsetHeight - margin;

    const x = margin + Math.random() * Math.max(0, maxX - margin);
    const y = margin + Math.random() * Math.max(0, maxY - margin);

    noButton.style.left = x + "px";
    noButton.style.top = y + "px";
}

noButton.addEventListener("pointerenter", moveNoButton);

noButton.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveNoButton();
}, { passive: false });

yesButton.addEventListener("click", () => {

    card.innerHTML = `
        <div class="success">

            <div class="icon">🥰</div>

            <h1>Wiedziałem! 🤎</h1>

            <div class="coffee">☕</div>

            <p>
                To teraz pozostaje nam tylko
                wybrać miejsce i termin!
            </p>

            <h2 style="color:#8b5e3c;">
                Nie mogę się doczekać! 🤎
            </h2>

        </div>
    `;

    // Deszcz kawy po kliknięciu TAK
    for (let i = 0; i < 30; i++) {
        setTimeout(createCoffee, i * 100);
    }
});

/* Animowane filiżanki i ziarenka */
function createCoffee() {

    const coffee = document.createElement("div");

    coffee.className = "coffee-float";

    coffee.textContent = ["☕", "🤎", "🫘", "♨️"][
        Math.floor(Math.random() * 4)
    ];

    coffee.style.left = Math.random() * 100 + "vw";
    coffee.style.fontSize = (Math.random() * 18 + 17) + "px";
    coffee.style.animationDuration = (Math.random() * 3 + 5) + "s";

    document.body.appendChild(coffee);

    setTimeout(() => coffee.remove(), 8500);
}

setInterval(createCoffee, 650);

</script>

</body>
</html>
